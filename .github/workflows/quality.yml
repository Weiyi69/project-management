name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orbit_test
          POSTGRES_USER: orbit_user
          POSTGRES_PASSWORD: orbit_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit_user -d orbit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://orbit_user:orbit_test_password@localhost:5432/orbit_test?schema=public
      ORBIT_TEST_DATABASE_URL: postgresql://orbit_user:orbit_test_password@localhost:5432/orbit_test?schema=public
      FRONTEND_URL: http://127.0.0.1:5173
      PORT: 3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm --filter @orbit/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-performance-and-browser-results
          path: |
            test-results/*.json
            playwright-report/
          if-no-files-found: ignore
